<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgOff" cx="30%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <linearGradient id="rimOff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="moonOff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="sunOff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgOff)" stroke="url(#rimOff)" stroke-width="2" />

  <g transform="translate(64, 64)">
    <!-- Sun side (muted) -->
    <path d="M 0 -28 A 28 28 0 0 1 0 28 Z" fill="url(#sunOff)" opacity="0.7" />

    <!-- Crescent Moon side (muted) -->
    <path d="M 0 -32 A 32 32 0 0 0 0 32 A 23 23 0 0 1 0 -32 Z" fill="url(#moonOff)" opacity="0.85" />

    <!-- Center Divider -->
    <path d="M 0 -34 L 0 34" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="0" r="3.5" fill="#cbd5e1" />

    <!-- Subtle rays (muted) -->
    <line x1="24" y1="-24" x2="34" y2="-34" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="32" y1="0" x2="44" y2="0" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="24" y1="24" x2="34" y2="34" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
