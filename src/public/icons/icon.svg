<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="bgGrad" cx="30%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070e" />
    </radialGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.8" />
    </linearGradient>

    <!-- Sun Warm Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Moon Cold Glow Gradient -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Ray Glow -->
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Switch Divider Glow -->
    <linearGradient id="switchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Filter for Soft Bloom / Neon Glow -->
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="2.5" />

  <!-- Ambient Light Orbs inside squircle -->
  <circle cx="36" cy="36" r="28" fill="#6366f1" opacity="0.18" />
  <circle cx="92" cy="88" r="26" fill="#f59e0b" opacity="0.15" />

  <!-- Main Celestial Day/Night Emblem (Centered at 64,64) -->
  <g transform="translate(64, 64)">
    <!-- Behind Sun: Radiant Solar Corona Flares (Day Side) -->
    <g filter="url(#glowSubtle)">
      <!-- Top-right ray -->
      <line x1="24" y1="-24" x2="36" y2="-36" stroke="url(#rayGrad)" stroke-width="3" stroke-linecap="round" />
      <!-- Right ray -->
      <line x1="33" y1="0" x2="48" y2="0" stroke="url(#rayGrad)" stroke-width="3.5" stroke-linecap="round" />
      <!-- Bottom-right ray -->
      <line x1="24" y1="24" x2="36" y2="36" stroke="url(#rayGrad)" stroke-width="3" stroke-linecap="round" />
      <!-- Top angled ray -->
      <line x1="8" y1="-32" x2="13" y2="-44" stroke="url(#rayGrad)" stroke-width="2.5" stroke-linecap="round" />
      <!-- Bottom angled ray -->
      <line x1="8" y1="32" x2="13" y2="44" stroke="url(#rayGrad)" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Sun Core: Right Semi-Circle with warm glow -->
    <path d="M 0 -28 A 28 28 0 0 1 0 28 Z" fill="url(#sunGrad)" filter="url(#bloom)" />

    <!-- Crescent Moon: Left Side with sharp stylized tips -->
    <path d="M 0 -32 A 32 32 0 0 0 0 32 A 23 23 0 0 1 0 -32 Z" fill="url(#moonGrad)" filter="url(#bloom)" />

    <!-- Sleek Neon Switch Divider Blade (Day/Night transition) -->
    <path d="M 0 -35 L 0 35" stroke="url(#switchGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Center Energy Core Spark -->
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" filter="url(#bloom)" />
    <circle cx="0" cy="0" r="2" fill="#38bdf8" />

    <!-- Night Sky Star Accents (Left side) -->
    <polygon points="-22,-18 -20,-13 -15,-11 -20,-9 -22,-4 -24,-9 -29,-11 -24,-13" fill="#ffffff" opacity="0.9" />
    <circle cx="-16" cy="18" r="2" fill="#c7d2fe" opacity="0.85" />
    <circle cx="-28" cy="5" r="1.5" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
